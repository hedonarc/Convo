repos:
  # ----------------------------
  # 🧹 General Hygiene
  # ----------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements

  # ----------------------------
  # 💅 Prettier (Frontend + Configs)
  # ----------------------------
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'pnpm --dir apps/web exec prettier --write "${@#apps/web/}"' --
        language: system
        pass_filenames: true
        files: ^apps/web/.*\.(js|jsx|ts|tsx|css|scss|html|json|md|ya?ml)$
        exclude: ^backend/
  # ----------------------------
  # 🐍 Ruff (Backend)
  # ----------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ----------------------------
  # ⚛️ ESLint (Frontend)
  # ----------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm --dir apps/web lint:fix
        language: system
        files: ^apps/web/.*\.[jt]sx?$
        pass_filenames: false

  # ----------------------------
  # 🧾 Conventional Commits
  # ----------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["--strict"]
